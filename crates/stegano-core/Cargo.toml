[package]
name = "stegano-core"
description = "Keyed, content-adaptive steganography for images and audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "tiff", "webp"] }
hound = "3.5.1"
claxon = "0.4.3"
flacenc = { version = "0.5.1", default-features = false, features = ["par"] }
mozjpeg-sys = { version = "2.2.3", default-features = false, features = ["unwinding"] }
libc = "0.2.191"
png = "0.18.1"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
rand = "0.10.3"
rand_chacha = "0.10.0"
rayon = "1.12.0"
zeroize = { version = "1.9.1", features = ["derive"] }
miniz_oxide = "0.9.1"
thiserror = "2.0.21"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "tiff", "webp", "jpeg"] }
