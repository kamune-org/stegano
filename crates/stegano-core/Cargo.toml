[package]
name = "stegano-core"
description = "Keyed, content-adaptive steganography for images and audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "webp"] }
hound = "3.5"
claxon = "0.4"
flacenc = { version = "0.4", default-features = false, features = ["par"] }
mozjpeg-sys = { version = "2", default-features = false, features = ["unwinding"] }
libc = "0.2"
png = "0.18"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
zeroize = { version = "1.7", features = ["derive"] }
miniz_oxide = "0.8"
thiserror = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "webp", "jpeg"] }
