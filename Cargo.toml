[workspace]
resolver = "3"
members = ["src-tauri", "crates/stegano-core", "crates/stegano-cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Kamune ORG"]
license = "MIT"
repository = "https://github.com/kamune-org/stegano"

[profile.release]
codegen-units = 1
lto = "thin"

# Dev builds (`tauri dev`, `cargo test`) optimize the hot code: STC, the cost
# filters, Argon2, AES and the image/audio codecs are unusably slow at -O0.
[profile.dev.package.stegano-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
