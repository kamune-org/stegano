[workspace]
resolver = "3"
members = ["src-tauri", "crates/stegano-core", "crates/stegano-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Kamune ORG"]
license = "MIT"
repository = "https://github.com/kamune-org/stegano"

[profile.release]
codegen-units = 1
lto = "thin"

# STC and the cost filters are hot loops; keep tests usable without --release.
[profile.dev.package.stegano-core]
opt-level = 3
