version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]

  # Dependabot's "bun" ecosystem reads package.json + bun.lock.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    groups:
      js-minor-patch:
        update-types: ["minor", "patch"]
